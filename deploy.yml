name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: если пришёл новый коммит, старую отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Собрать артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Выложить
        id: deployment
        uses: actions/deploy-pages@v4
