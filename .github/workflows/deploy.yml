name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Если пришёл новый коммит, недоделанную выкладку отменяем.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /var/www/musicalonice

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4

      - name: Подготовить SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Залить сайт на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
