<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musical on Ice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --depth:#051320;
    --crust:#D3E5F3;
    --mist:#88A6C0;
    --spot:#E8B04B;
    --glare:#F4FAFF;
    --hair:rgba(211,229,243,.16);
    --display:"Prata",Georgia,"Times New Roman",serif;
    --text:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --page:min(1100px,100% - 2.5rem);
  }
  *,*::before,*::after{box-sizing:border-box}

  /* ——— светлое оформление ——— */
  html[data-theme="light"]{
    --depth:#CFE2F7;
    --crust:#14324E;
    --mist:#5878A0;
    --glare:#08223C;
    --hair:rgba(20,50,78,.2);
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(130% 90% at 50% 0%,#F4FAFF 0%,#DDEBFC 36%,#B9D3F0 100%) fixed,
      var(--depth);
  }
  html[data-theme="light"] .slab{
    background:rgba(247,251,255,.66);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 50px -40px rgba(12,40,60,.45);
  }
  html[data-theme="light"] .arena{opacity:.5;mix-blend-mode:multiply}
  html[data-theme="light"] .lamp{
    background:radial-gradient(15rem 15rem at var(--lx,50%) var(--ly,42%),
      rgba(255,255,255,.55) 0%,rgba(232,176,75,.12) 46%,transparent 72%);
    mix-blend-mode:screen;
  }
  html[data-theme="light"] .logo{filter:drop-shadow(0 0 40px rgba(232,176,75,.25)) drop-shadow(0 2px 10px rgba(12,40,60,.25))}
  html[data-theme="light"] .buy{
    color:#F5FAFF;background:#14395C;
    box-shadow:0 2px 20px -10px rgba(12,40,60,.6);
  }
  html[data-theme="light"] .buy:hover{background:#0D2B48;box-shadow:0 16px 34px -16px rgba(12,40,60,.5)}
  html[data-theme="light"] .pick{color:var(--crust);border-color:rgba(20,50,78,.3)}
  html[data-theme="light"] .pick:hover{border-color:#14395C;background:rgba(20,57,92,.07);color:var(--glare)}
  html[data-theme="light"] .seats.few,html[data-theme="light"] .act-no,html[data-theme="light"] .role{color:#A77518}
  html[data-theme="light"] .title,html[data-theme="light"] .lede,html[data-theme="light"] .where,html[data-theme="light"] .mark{text-shadow:none}
  html[data-theme="light"] .piano{
    background:linear-gradient(180deg,#1A3E55 0%,#102B3D 46%,#081824 100%);
  }

  /* ——— переключатель ——— */
  .theme{
    position:relative;flex:none;
    display:inline-flex;align-items:center;gap:0;
    width:7.4rem;height:2rem;padding:.2rem;
    border:1px solid var(--hair);border-radius:999px;
    background:rgba(211,229,243,.08);cursor:pointer;
    font:500 .72rem/1 var(--text);color:var(--mist);
    transition:background .25s,border-color .25s;
  }
  .theme:hover{border-color:rgba(232,176,75,.5)}
  .theme-side{flex:1;text-align:center;z-index:1;transition:color .25s}
  .theme-knob{
    position:absolute;top:.2rem;left:.2rem;width:calc(50% - .2rem);height:calc(100% - .4rem);
    border-radius:999px;
    background:linear-gradient(180deg,#F7F5EE,#E2DED0);
    box-shadow:0 2px 6px -2px rgba(0,0,0,.6);
    transition:translate .25s cubic-bezier(.3,.7,.4,1);
  }
  .theme .theme-dark{color:#12242C}
  html[data-theme="light"] .theme-knob{translate:100% 0}
  html[data-theme="light"] .theme .theme-dark{color:var(--mist)}
  html[data-theme="light"] .theme .theme-light{color:#12242C}
  @media (max-width:520px){.theme{width:5.4rem;font-size:.64rem}}
  html{scroll-behavior:smooth}
  body{
    margin:0;color:var(--crust);font-family:var(--text);
    font-size:clamp(1rem,.96rem + .2vw,1.0625rem);line-height:1.65;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(130% 90% at 50% 0%,#1F5476 0%,#0E2C47 42%,#051320 100%) fixed,
      var(--depth);
  }
  h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0}
  p{margin:0}
  a{color:inherit}
  :is(a,button):focus-visible{outline:2px solid var(--glare);outline-offset:3px}
  .wrap{width:var(--page);margin-inline:auto}

  /* ——— лёд, вид сверху: фиксированная сцена под контентом ——— */
  .arena{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .arena svg{position:absolute;inset:0;width:100%;height:100%}
  .grain{opacity:.055;mix-blend-mode:screen}
  .lamp{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(15rem 15rem at var(--lx,50%) var(--ly,42%),
      rgba(244,250,255,.17) 0%,rgba(232,176,75,.08) 44%,transparent 72%);
    opacity:0;transition:opacity .7s ease;
  }
  .lamp.on{opacity:1}
  .pool{
    position:absolute;width:min(52rem,105vw);aspect-ratio:1/.62;left:50%;top:18%;
    translate:-50% -50%;
    background:radial-gradient(ellipse at center,rgba(244,250,255,.16),rgba(232,176,75,.09) 40%,transparent 70%);
    filter:blur(10px);
    animation:sweep 72s ease-in-out infinite alternate;
  }
  @keyframes sweep{
    0%{transform:translate(-14%,0) scale(1)}
    50%{transform:translate(10%,9%) scale(1.09)}
    100%{transform:translate(-6%,-4%) scale(.96)}
  }

  /* оловянная фигурка */
  .tin .base{fill:url(#pewter-base);stroke:rgba(10,28,35,.75);stroke-width:.8}
  .tin .body{fill:url(#pewter);stroke:rgba(10,28,35,.7);stroke-width:.7;stroke-linejoin:round}
  .tin .limb{fill:none;stroke:url(#pewter-line);stroke-width:3.4;stroke-linecap:round}
  .tin .edge{fill:none;stroke:rgba(244,250,255,.55);stroke-width:.8;stroke-linecap:round}
  .tin .shade{fill:rgba(6,18,24,.5);filter:blur(2px)}
  .tin{opacity:.92}
  .chip{fill:rgba(244,250,255,.5)}

  /* ——— контент ——— */
  .page{position:relative;z-index:1}

  .top{
    position:fixed;inset:0 0 auto 0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    width:var(--page);margin-inline:auto;padding-block:.85rem;
  }
  .top::before{
    content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;translate:-50% 0;
    background:rgba(5,19,32,.74);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--hair);
  }
  html[data-theme="light"] .top::before{background:rgba(236,244,253,.8)}
  .slab,#shows,#dates,#about,#piano{scroll-margin-top:5rem}
  .mark{
    font-family:var(--display);font-size:1.06rem;letter-spacing:.055em;
    text-decoration:none;color:var(--glare);text-shadow:0 1px 10px rgba(5,18,30,.95);
  }
  .logo{
    display:block;width:min(34rem,80vw);height:auto;margin-inline:auto;
    opacity:0;animation:fade 1.4s ease .25s forwards;
    filter:drop-shadow(0 0 48px rgba(232,176,75,.22)) drop-shadow(0 2px 18px rgba(5,18,30,.8));
  }
  .logo-foot{display:block;width:9.5rem;height:auto;opacity:.85}
  
  @media (max-width:820px){.nav{display:none}}

  /* ——— навигация в шапке ——— */
  .nav{display:flex;gap:1.6rem;font-size:.9rem}
  .nav a{color:var(--mist);text-decoration:none;padding-block:.2rem;transition:color .2s}
  .nav a:hover{color:var(--crust)}
  @media (max-width:820px){.nav{display:none}}

  /* ——— рояль ——— */
  .piano-slab{padding-bottom:clamp(1.6rem,3vw,2.4rem)}
  .piano{
    margin-top:clamp(1.8rem,4vw,2.6rem);
    border-radius:.5rem .5rem .35rem .35rem;
    background:linear-gradient(180deg,#132F45 0%,#0A2034 42%,#04101C 100%);
    box-shadow:0 34px 70px -44px rgba(0,0,0,.95),inset 0 1px 0 rgba(244,250,255,.14);
    padding:.9rem .8rem 0;
    overflow:hidden;
  }
  .fallboard{
    display:flex;align-items:center;gap:1rem;
    padding:0 .3rem .85rem;
    font:400 .78rem/1 var(--display);letter-spacing:.22em;color:rgba(211,229,243,.6);
    border-bottom:2px solid #8E2B2B;
  }
  .fallboard span{margin-left:auto;letter-spacing:0;font-family:var(--text);font-size:.74rem;color:var(--mist)}

  .keybed{
    --n:14;
    position:relative;display:flex;gap:0;
    padding-top:.5rem;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .wkey{
    position:relative;flex:1 1 0;min-width:0;
    height:clamp(7rem,13vw,10.5rem);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:.55rem;
    font:500 .62rem/1 var(--text);color:rgba(24,48,58,.45);
    border:0;cursor:pointer;-webkit-appearance:none;appearance:none;
    border-radius:0 0 .22rem .22rem;
    background:linear-gradient(180deg,#ECE9DE 0%,#F7F5EE 26%,#FEFDFA 78%,#F1EEE3 100%);
    box-shadow:
      inset 1px 0 0 rgba(255,255,255,.95),
      inset -1px 0 0 rgba(24,48,58,.22),
      0 4px 0 #C6C8BE,
      0 8px 14px -8px rgba(0,0,0,.6);
    transform-origin:top center;
    transition:transform .07s ease,box-shadow .07s ease,background .18s;
  }
  .wkey.lit{
    transform:translateY(2px) perspective(520px) rotateX(-4deg);
    background:linear-gradient(180deg,#F6EBD4 0%,#FDF6E6 30%,#FFFCF4 80%,#F3E6C9 100%);
    box-shadow:
      inset 1px 0 0 rgba(255,255,255,.9),
      inset -1px 0 0 rgba(24,48,58,.22),
      0 1px 0 #C6C8BE,
      0 3px 10px -4px rgba(232,176,75,.6);
  }
  .bkey{
    position:absolute;top:.5rem;z-index:3;
    left:calc((var(--after) + 1) / var(--n) * 100%);
    width:calc(100% / var(--n) * .6);
    height:62%;
    margin-left:calc(100% / var(--n) * -.3);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:.4rem;
    font:500 .58rem/1 var(--text);color:rgba(211,229,243,.45);
    border:0;cursor:pointer;-webkit-appearance:none;appearance:none;
    border-radius:0 0 .16rem .16rem;
    background:linear-gradient(180deg,#22374A 0%,#10202F 32%,#040B12 100%);
    box-shadow:
      inset 0 1px 0 rgba(244,250,255,.22),
      inset 0 -2px 0 rgba(211,229,243,.16),
      .12rem .14rem .4rem rgba(0,0,0,.6);
    transform-origin:top center;
    transition:transform .07s ease,box-shadow .07s ease,background .18s;
  }
  .bkey.lit{
    transform:translateY(2px) perspective(520px) rotateX(-4deg);
    background:linear-gradient(180deg,#4A3A22 0%,#2A1F10 34%,#0B0805 100%);
    box-shadow:inset 0 1px 0 rgba(244,250,255,.2),0 2px 10px -3px rgba(232,176,75,.55);
  }
  .piano-bar{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-top:1.8rem}
  .mel{
    font:500 1rem/1 var(--text);cursor:pointer;color:var(--crust);
    background:rgba(211,229,243,.06);border:1px solid var(--hair);border-radius:2rem;
    padding:1rem 1.7rem;transition:background .2s,border-color .2s,color .2s,transform .12s;
  }
  .mel:hover{border-color:rgba(232,176,75,.55);color:var(--glare)}
  .mel:active{transform:translateY(1px)}
  .mel.on{background:var(--spot);border-color:var(--spot);color:#0A1A28}
  html[data-theme="light"] .mel{background:rgba(20,57,92,.05);border-color:rgba(20,50,78,.25);color:#14395C}
  html[data-theme="light"] .mel:hover{border-color:#14395C}
  html[data-theme="light"] .mel.on{background:var(--spot);border-color:var(--spot);color:#14395C}
  @media (max-width:560px){.mel{padding:.85rem 1.2rem;font-size:.92rem}}
  .piano-hint{font-size:.84rem;color:var(--mist)}
  @media (max-width:620px){
    .keybed{--n:7}
    .keybed [data-oct="2"]{display:none}
    .wkey{font-size:0;padding-bottom:0;height:9.5rem}
    .bkey{font-size:0}
    .piano{padding:.8rem .6rem 0}
    .fallboard{font-size:.68rem;letter-spacing:.16em;white-space:nowrap}
    .fallboard span{display:none}
  }

  /* ——— афиши шоу: один ряд с прокруткой ——— */
  .shows-rail{position:relative;margin-top:clamp(1.8rem,4vw,2.6rem)}
  .shows-rail::after{
    content:"";position:absolute;top:0;bottom:.8rem;right:-1px;width:4rem;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(7,22,38,.75));
    opacity:0;transition:opacity .3s;
  }
  .shows-rail.more::after{opacity:1}
  html[data-theme="light"] .shows-rail::after{background:linear-gradient(90deg,transparent,rgba(224,238,253,.9))}

  .shows{
    --gap:clamp(.9rem,1.6vw,1.4rem);
    --seen:3;
    display:flex;gap:var(--gap);
    overflow-x:auto;overscroll-behavior-x:contain;
    scroll-snap-type:x mandatory;
    padding-bottom:.8rem;
    scrollbar-width:thin;scrollbar-color:rgba(232,176,75,.5) transparent;
  }
  .shows::-webkit-scrollbar{height:5px}
  .shows::-webkit-scrollbar-track{background:var(--hair);border-radius:99px}
  .shows::-webkit-scrollbar-thumb{background:rgba(232,176,75,.55);border-radius:99px}
  .shows::-webkit-scrollbar-thumb:hover{background:rgba(232,176,75,.8)}

  .show{
    flex:0 0 calc((100% - (var(--seen) - 1) * var(--gap)) / var(--seen));
    scroll-snap-align:start;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:rgba(7,22,38,.5);
    border:1px solid var(--hair);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .show:hover{
    transform:translateY(-4px);
    border-color:rgba(232,176,75,.45);
    box-shadow:0 26px 46px -34px rgba(0,0,0,.9);
  }
  .show-poster{
    position:relative;aspect-ratio:3/4;overflow:hidden;
    background:linear-gradient(160deg,#143147,#081826 60%,#040E18);
    display:flex;align-items:center;justify-content:center;
  }
  .show-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .show:hover .show-poster img{transform:scale(1.04)}
  .show-blank{
    font-family:var(--display);font-size:1.05rem;color:rgba(211,229,243,.5);
    text-align:center;padding:1.2rem;line-height:1.3;
  }
  .show-blank small{display:block;font:400 .68rem/1.4 var(--text);color:var(--mist);margin-top:.5rem}
  .show-body{padding:1rem 1rem 1.2rem}
  .show-title{font-family:var(--display);font-size:1.1rem;color:#E8C078;line-height:1.2}
  .show-status{font:600 .72rem/1 var(--text);letter-spacing:.06em;text-transform:uppercase;color:var(--glare);margin-top:.55rem}
  .show-text{font-size:.84rem;color:var(--mist);margin-top:.65rem}
  @media (max-width:560px){
    .show-body{padding:.7rem .7rem .85rem}
    .show-title{font-size:.95rem}
    .show-status{font-size:.62rem;margin-top:.4rem}
    .show-text{font-size:.76rem;line-height:1.45;margin-top:.45rem;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .show-blank{font-size:.85rem;padding:.6rem}
  }
  html[data-theme="light"] .show{background:rgba(255,255,255,.66)}
  html[data-theme="light"] .show-title{color:#9C6C12}
  html[data-theme="light"] .show-poster{background:linear-gradient(160deg,#C2DAF4,#9FC0E4 60%,#84AAD6)}
  html[data-theme="light"] .show-blank{color:rgba(22,57,78,.55)}
  @media (max-width:900px){.shows{--seen:3}}
  @media (max-width:560px){.shows{--seen:2.25}}

  /* ——— страница шоу ——— */
  .showview{display:block}
  .sh-hero{position:relative;isolation:isolate;overflow:hidden;padding-block:7.5rem clamp(2.5rem,5vw,4rem)}
  .sh-hero-bg{
    position:absolute;inset:0;z-index:-2;
    background-image:var(--poster);background-size:cover;background-position:center;
    filter:blur(26px) saturate(1.15);transform:scale(1.12);opacity:.55;
  }
  .sh-hero-vid{
    position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;
    filter:blur(var(--hblur,22px)) saturate(1.1);transform:scale(1.14);opacity:.6;
    pointer-events:none;
  }
  html[data-theme="light"] .sh-hero-vid{opacity:.45}
  @media (prefers-reduced-motion:reduce){.sh-hero-vid{display:none}}
  .sh-hero::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(5,19,32,.72),rgba(5,19,32,.86) 60%,var(--depth));
  }
  html[data-theme="light"] .sh-hero-bg{opacity:.4}
  html[data-theme="light"] .sh-hero::after{
    background:linear-gradient(180deg,rgba(244,250,255,.72),rgba(230,241,253,.88) 60%,var(--depth));
  }
  .sh-top{display:grid;gap:clamp(1.6rem,4vw,3rem);align-items:end}
  @media (min-width:880px){.sh-top{grid-template-columns:17rem 1fr}}
  .sh-cover{
    width:100%;aspect-ratio:3/4;object-fit:cover;display:block;
    border:1px solid var(--hair);
    box-shadow:0 40px 70px -44px rgba(0,0,0,.95);
  }
  @media (max-width:879px){.sh-cover{max-width:14rem}}
  .sh-back{
    display:inline-flex;align-items:center;gap:.45rem;margin-bottom:1.4rem;
    color:var(--mist);font-size:.86rem;text-decoration:none;transition:color .2s;
  }
  .sh-back:hover{color:var(--crust)}
  .sh-h1{font-family:var(--display);font-weight:400;line-height:1.02;color:var(--glare);
    font-size:clamp(2.4rem,1.6rem + 3.4vw,4.6rem)}
  .sh-status{font:600 .74rem/1 var(--text);letter-spacing:.1em;text-transform:uppercase;color:#E8C078;margin-bottom:1rem}
  html[data-theme="light"] .sh-status{color:#9C6C12}
  .sh-lead{max-width:34ch;margin-top:1.1rem;font-size:clamp(1.05rem,1rem + .5vw,1.35rem);line-height:1.45}
  .sh-actions{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:center;margin-top:1.8rem}

  .sh-body{display:grid;gap:clamp(2rem,4vw,3.5rem);padding-block:clamp(2.5rem,5vw,4rem)}
  @media (min-width:880px){.sh-body{grid-template-columns:1fr 17rem}}
  .sh-about{max-width:58ch;font-size:1.02rem}
  .sh-about p+p{margin-top:1.1rem}
  .sh-side{border-top:1px solid var(--hair);padding-top:1.2rem}
  .sh-side h3{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--glare)}
  .sh-fact{display:flex;justify-content:space-between;gap:1rem;padding-block:.75rem;border-bottom:1px solid var(--hair);font-size:.9rem}
  .sh-fact dt{color:var(--mist)}
  .sh-fact dd{margin:0;color:var(--crust);text-align:right}

  .sh-video{padding-bottom:clamp(2.5rem,5vw,4rem)}
  .sh-video h3,.sh-others h3{
    font-family:var(--display);font-weight:400;color:var(--glare);
    font-size:clamp(1.4rem,1.2rem + 1vw,2rem);margin-bottom:1.2rem;
  }
  .video-frame{
    aspect-ratio:16/9;width:100%;
    border:1px solid var(--hair);background:rgba(7,22,38,.55);
    display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:.9rem;
  }
  html[data-theme="light"] .video-frame{background:rgba(247,251,255,.6)}
  .video-frame iframe,.video-frame video{width:100%;height:100%;border:0;display:block}

  .sh-others{padding-bottom:clamp(3rem,6vw,5rem)}
  .sh-others .shows{--seen:4}
  @media (max-width:900px){.sh-others .shows{--seen:3}}
  @media (max-width:560px){.sh-others .shows{--seen:2.25}}

  /* ——— музыка ——— */
  #music{scroll-margin-top:5rem}
  .albums{list-style:none;margin:clamp(1.8rem,4vw,2.6rem) 0 0;padding:0}
  .sh-shots{margin-top:3.4rem;margin-bottom:clamp(3rem,6vw,4.5rem)}
  .sh-shots h3{
    font-family:var(--display);font-weight:400;color:var(--glare);
    font-size:clamp(1.4rem,1.2rem + 1vw,2rem);margin:0 0 1.2rem;
  }
  .shots-rail{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;margin-inline:calc(-1 * max(0px,(100vw - var(--page)) / 2));padding-inline:max(0px,(100vw - var(--page)) / 2)}
  .shots{display:flex;gap:1rem;padding-bottom:.6rem;align-items:stretch}
  .shots-rail::-webkit-scrollbar{display:none}
  .shot{

  .lightbox{

  .lb-close,.lb-nav{

  }

  .lb-next{right:1.2rem}

  .sh-music{margin-top:3.4rem}

  .trackset{border-top:1px solid var(--hair);padding-top:1.2rem;margin-bottom:2.2rem}
  .trk .pick,.trk-head .pick{padding:.6rem 1.15rem;font-size:.82rem;text-decoration:none;white-space:nowrap}
  .trk-head .album-side{display:flex;align-items:center;gap:.9rem}
  .trk-head{display:grid;grid-template-columns:4.5rem 1fr auto;gap:.3rem 1.2rem;align-items:center}
  .trk-cover{
    position:relative;width:4.5rem;aspect-ratio:1;overflow:hidden;
    background:linear-gradient(160deg,#143147,#081826 60%,#040E18);
    box-shadow:0 14px 26px -18px rgba(0,0,0,.9);
  }
  html[data-theme="light"] .trk-cover{background:linear-gradient(160deg,#C2DAF4,#9FC0E4 60%,#84AAD6)}
  .trk-cover img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
  .trks{list-style:none;margin:1rem 0 0;padding:0}
  .trk{
    position:relative;display:grid;grid-template-columns:2rem 1fr auto;gap:.9rem;align-items:center;
    padding:.55rem .2rem;border-bottom:1px solid var(--hair);
  }
  .trk-num{
    width:2rem;text-align:center;font-size:.85rem;letter-spacing:.06em;
    color:var(--mist);font-variant-numeric:tabular-nums;
  }
  .trk-play{
    width:2rem;height:2rem;border-radius:50%;border:1px solid var(--hair);cursor:pointer;
    background:transparent;display:flex;align-items:center;justify-content:center;
    transition:background .2s,border-color .2s;
  }
  .trk-play:hover{background:rgba(211,229,243,.08);border-color:var(--mist)}
  .trk-play::before{
    content:"";width:0;height:0;margin-left:.16rem;
    border-left:.55rem solid currentColor;border-top:.35rem solid transparent;border-bottom:.35rem solid transparent;
  }
  .trk.playing.paused .trk-play::before{
    width:0;height:0;margin-left:.16rem;border:0;background:none;
    border-left:.55rem solid currentColor;border-top:.35rem solid transparent;border-bottom:.35rem solid transparent;
  }
  .trk.playing .trk-play::before{
    width:.5rem;height:.62rem;margin-left:0;border:0;
    background:linear-gradient(to right,currentColor 0 .16rem,transparent .16rem .34rem,currentColor .34rem .5rem);
  }
  .trk-title{font-size:1rem}
  .trk.playing .trk-title{color:var(--spot)}
  .trk-len{font-size:.9rem;color:var(--mist);font-variant-numeric:tabular-nums}
  .trk-mute .trk-title{color:var(--mist)}
  .trk-bar{
    position:absolute;left:0;right:0;bottom:0;height:10px;z-index:2;
    display:flex;align-items:flex-end;cursor:pointer;touch-action:none;
  }
  .trk-mute .trk-bar{display:none}
  .trk-bar::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
    background:var(--hair);opacity:0;transition:opacity .2s;
  }
  .trk:hover .trk-bar::before,.trk.playing .trk-bar::before{opacity:1}
  .trk-bar i{position:relative;display:block;height:2px;width:0;background:var(--spot);border-radius:2px;transition:height .15s}
  .trk.playing .trk-bar i::after{
    content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;border-radius:50%;
    background:var(--spot);transform:translateY(-50%);
  }
  .trk-bar:hover::before,.trk-bar:hover i{height:4px}
  @media (max-width:620px){
    .trk-head{grid-template-columns:3.6rem 1fr;gap:.3rem .9rem}
    .trk-cover{width:3.6rem}
    .trk-head .album-side{grid-column:1 / -1;justify-self:start;margin-top:.5rem}
  }
  .album{
    display:grid;gap:.4rem 1.4rem;align-items:center;
    grid-template-columns:5.5rem 1fr auto;
    padding-block:1.1rem;border-bottom:1px solid var(--hair);
  }
  .album:first-child{border-top:1px solid var(--hair)}
  .album-cover{
    position:relative;width:5.5rem;aspect-ratio:1;overflow:hidden;
    background:linear-gradient(160deg,#143147,#081826 60%,#040E18);
    box-shadow:0 14px 26px -18px rgba(0,0,0,.9);
  }
  html[data-theme="light"] .album-cover{background:linear-gradient(160deg,#C2DAF4,#9FC0E4 60%,#84AAD6)}
  .album-cover img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
  .album-note{
    position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);
    fill:none;stroke:rgba(215,236,255,.8);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
  }
  .album-note circle{fill:rgba(215,236,255,.8)}
  html[data-theme="light"] .album-note{stroke:#fff}
  html[data-theme="light"] .album-note circle{fill:#fff}
  .album.playing .album-note,.album-cover:has(.album-play):hover .album-note{opacity:0}
  .album-play{
    position:absolute;inset:0;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(5,19,32,.35);opacity:0;transition:opacity .2s;
  }
  .album-cover:hover .album-play,.album-play:focus-visible,.album.playing .album-play{opacity:1}
  .album-play::before{
    content:"";width:0;height:0;margin-left:.2rem;
    border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;
  }
  .album.playing .album-play::before{
    width:.75rem;height:.9rem;margin:0;border:0;
    background:linear-gradient(90deg,#fff 0 35%,transparent 35% 65%,#fff 65%);
  }
  .album-title{font-family:var(--display);font-size:1.15rem;color:var(--glare);line-height:1.2}
  .album-sub{font-size:.82rem;color:var(--mist);margin-top:.2rem}
  .album-side{display:flex;align-items:center;gap:1rem;justify-content:flex-end}
  .album-price{font-family:var(--display);font-size:1.05rem;color:var(--glare);white-space:nowrap}
  .album-soon{font:600 .7rem/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
  .album .pick{padding:.6rem 1.15rem;font-size:.82rem;text-decoration:none;white-space:nowrap}
  .album-bar{
    grid-column:2 / -1;height:12px;display:none;align-items:center;position:relative;
    cursor:pointer;touch-action:none;
  }
  .album.playing .album-bar{display:flex}
  .album-bar::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--hair);border-radius:2px}
  .album-bar i{position:relative;display:block;height:2px;width:0;background:var(--spot);border-radius:2px}
  .album.playing .album-bar i::after{
    content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;border-radius:50%;
    background:var(--spot);transform:translateY(-50%);
  }
  .album.has-tracks{cursor:pointer}
  .album-toggle{
    margin-top:.45rem;padding:0;border:0;background:none;cursor:pointer;color:var(--mist);
    font:600 .7rem/1 var(--text);letter-spacing:.08em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:.4rem;
  }
  .album-toggle:hover{color:var(--crust)}
  .album-toggle i{
    width:.42rem;height:.42rem;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg) translate(-1px,-1px);transition:transform .2s;
  }
  .album.open .album-toggle i{transform:rotate(-135deg) translate(-1px,-1px)}
  .album-panel{grid-column:1 / -1;display:none}
  .album.open .album-panel{display:block;margin-top:.7rem}
  .album-panel .trks{margin:0}
  .album-panel .trk:last-child{border-bottom:0}
  @media (max-width:640px){
    .album{grid-template-columns:4.5rem 1fr;gap:.5rem 1rem}
    .album-cover{width:4.5rem}
    .album-play{opacity:1;background:rgba(5,19,32,.25)}
    .album-side{grid-column:2;justify-content:flex-start}
    .album-bar,.album-panel{grid-column:1 / -1}
  }

  /* ——— обычные кнопки ——— */
  .buy{
    font:500 .98rem/1 var(--text);
    display:inline-block;padding:1.05rem 2.1rem;
    color:#11222B;background:#F4FAFF;
    border:0;border-radius:999px;cursor:pointer;
    box-shadow:0 2px 20px -10px rgba(0,0,0,.7);
    transition:transform .25s,box-shadow .25s,background .25s;
  }
  .buy:hover{background:#FFFFFF;transform:translateY(-2px);box-shadow:0 16px 34px -16px rgba(244,250,255,.45)}
  .buy:active{transform:translateY(0)}
  .buy[disabled]{cursor:default;opacity:.55;transform:none;box-shadow:none}
  .quiet{
    color:var(--crust);font-size:.95rem;text-decoration:none;
    border-bottom:1px solid var(--hair);padding-bottom:.25rem;transition:border-color .25s;
  }
  .quiet:hover{border-color:var(--glare)}
  .pick{
    font:500 .88rem/1 var(--text);
    background:none;border:1px solid var(--hair);border-radius:999px;
    color:var(--crust);padding:.7rem 1.4rem;cursor:pointer;
    transition:border-color .25s,color .25s,background .25s;
  }
  .pick:hover{border-color:rgba(244,250,255,.7);color:var(--glare);background:rgba(244,250,255,.06)}
  .pick[disabled]{opacity:.35;cursor:default}
  .pick[disabled]:hover{border-color:var(--hair);color:var(--crust);background:none}

  /* ——— герой ——— */
  .rink-head{
    min-height:min(100svh,50rem);display:grid;align-content:center;justify-items:center;
    text-align:center;padding-block:7rem 5rem;
  }
  .title-logo{margin:0;line-height:0}
  .title{
    font-size:clamp(3.2rem,12.5vw,9rem);letter-spacing:.02em;color:var(--glare);
    text-shadow:0 0 70px rgba(232,176,75,.2),0 2px 14px rgba(5,18,30,.85);
  }
  .title span{display:inline-block;opacity:0;translate:0 .3em;animation:rise .9s cubic-bezier(.2,.8,.25,1) forwards}
  @keyframes rise{to{opacity:1;translate:0 0}}
  .lede{
    max-width:34ch;margin:1.5rem auto 0;font-size:clamp(1.05rem,1rem + .45vw,1.3rem);
    text-shadow:0 1px 12px rgba(5,18,30,.9);opacity:0;animation:fade 1s ease .9s forwards;
  }
  .where{margin-top:1rem;color:var(--mist);font-size:.95rem;text-shadow:0 1px 10px rgba(5,18,30,.9);opacity:0;animation:fade 1s ease 1.15s forwards}
  @keyframes fade{to{opacity:1}}
  .cta{display:flex;flex-wrap:wrap;gap:1.6rem;align-items:center;justify-content:center;margin-top:2.6rem;opacity:0;animation:fade 1s ease 1.4s forwards}

  /* ——— ледяные плиты ——— */
  .slab{
    background:rgba(7,22,38,.62);
    backdrop-filter:blur(9px) saturate(1.2);
    -webkit-backdrop-filter:blur(9px) saturate(1.2);
    border:1px solid var(--hair);
    box-shadow:inset 0 1px 0 rgba(244,250,255,.16),0 24px 60px -40px rgba(0,0,0,.9);
    padding:clamp(2rem,5vw,4rem);
    margin-bottom:clamp(2.5rem,6vw,5rem);
  }
  .h2{font-size:clamp(1.9rem,1.4rem + 2vw,3.1rem);max-width:22ch}
  .say{max-width:58ch;margin-top:1.1rem;color:var(--mist)}

  .nearest{
    display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;
    padding:.7rem 1rem;margin-bottom:clamp(1.6rem,3vw,2.4rem);
    border:1px solid var(--hair);text-decoration:none;
    transition:border-color .25s,background .25s;
  }
  .nearest:hover{border-color:rgba(232,176,75,.55);background:rgba(232,176,75,.06)}
  .nearest-tag{font:600 .7rem/1 var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--mist)}
  .nearest-date{font-family:var(--display);font-size:1.05rem;color:var(--glare)}
  .nearest-cta{
    margin-left:auto;font:500 .78rem/1 var(--text);color:#E8C078;
    border-bottom:1px solid rgba(232,176,75,.4);padding-bottom:.15rem;
  }

    max-width:40ch;margin-top:1.2rem;
    font-size:clamp(1.15rem,1rem + .7vw,1.55rem);line-height:1.4;color:var(--crust);

  @media (min-width:640px){.facts{grid-template-columns:repeat(3,1fr)}}
  .fact{border-top:1px solid var(--hair);padding-top:1rem}
  .fact-value{font-family:var(--display);font-size:clamp(1.8rem,1.4rem + 1.6vw,2.6rem);color:var(--glare);line-height:1}
  .fact-label{font-size:.84rem;color:var(--mist);margin-top:.5rem}
  .reel{margin-top:clamp(2rem,4vw,3rem)}

  .dates{list-style:none;margin:clamp(2rem,4vw,3rem) 0 0;padding:0}
  .date{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:center;padding-block:1.2rem;border-bottom:1px solid var(--hair)}
  .day{font-family:var(--display);font-size:1.4rem;min-width:8rem;color:var(--glare)}
  .hour{color:var(--mist);min-width:4.5rem}
  .seats{font-size:.85rem;color:var(--mist);flex:1}
  .seats.few{color:var(--spot)}
  .seats.none{opacity:.5}

  .foot{padding-block:2.5rem 4rem;color:var(--mist);font-size:.9rem}
  .foot-grid{display:flex;flex-wrap:wrap;gap:2rem 3.5rem;justify-content:space-between;align-items:flex-start}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
  }
</style>

<body>

<!-- ═══ лёд сверху: дорожки, оловянные фигурки, скол льда ═══ -->
<div class="arena" id="arena" aria-hidden="true">
  <div class="pool"></div>
  <div class="lamp" id="lamp"></div>

  <svg class="grain" preserveAspectRatio="none">
    <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#grain-f)"/>
  </svg>

  <svg id="stage" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs>

      <!-- оловянный солдат: алый мундир, сабля -->

        <ellipse class="shade" cx="1" cy="1.6" rx="14" ry="5"/>

        <path d="M-8 -34.6 C -9.2 -27 -8.8 -22 -8 -18.6 L8.2 -18.6 C 9 -22.4 9.4 -28 8.2 -34.6 Z" fill="#AE3130" stroke="#38110F" stroke-width=".7"/>
        <path d="M-8.6 -33 C -9.6 -26 -9.2 -21.6 -8.4 -18.8" fill="none" stroke="#C8514C" stroke-width="1.4"/>
        <path d="M-8.4 -25.6 H8.8" stroke="#D9A94F" stroke-width="1.7"/>
        <path d="M-5.8 -33.6 L4.8 -24.4 M5.8 -33.6 L-4.8 -24.4" stroke="#F1F3EC" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx=".2" cy="-35" rx="8.2" ry="2.6" fill="#C4453F" stroke="#38110F" stroke-width=".6"/>

        <path d="M19.4 -28.6 L21.2 -27.6" stroke="#F1F3EC" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21.6 -28.4 C 25.4 -31 29 -33.6 32.4 -36.4" fill="none" stroke="#DCE8F4" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="21.4" cy="-27.8" r="1.4" fill="#D9A94F"/>

      </g>

      <!-- деревянный барабанщик: синий мундир, барабан -->
      <g id="sol-blue" class="tin">
        <ellipse class="shade" cx="1" cy="1.6" rx="13.6" ry="4.8"/>
        <ellipse class="base" cx="0" cy="0" rx="12" ry="4.4"/>
        <ellipse class="edge" cx="0" cy="-.7" rx="9.2" ry="2.8"/>
        <path d="M-7.6 -1.4 H-1.2 M1.8 -1 H8" stroke="#DCE8F4" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M-3.2 -19 L-4.4 -6" stroke="#3E4A5C" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M3.8 -19 L5.2 -6" stroke="#3E4A5C" stroke-width="3.4" stroke-linecap="round"/>

const DEFAULTS = JSON.parse(document.getElementById('site-content').textContent);
let C = DEFAULTS;

/* Источник правды — content.json рядом с сайтом; его правит админка.
   Если файл недоступен (открыли index.html двойным кликом), работает встроенный блок ниже. */
/* Если в опубликованном тексте нет какого-то раздела, берём его из встроенного шаблона. */
function withDefaults(data, tpl) {
  for (const k of Object.keys(tpl || {})) {
    if (data[k] === undefined) data[k] = JSON.parse(JSON.stringify(tpl[k]));
    else if (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && tpl[k] && typeof tpl[k] === 'object' && !Array.isArray(tpl[k])) withDefaults(data[k], tpl[k]);
  }
  return data;
}

async function loadContent() {
  try {
    const r = await fetch('content.json', { cache: 'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (data && data.shows) C = withDefaults(data, DEFAULTS);
    }
  } catch (e) {}
}

addEventListener('message', (e) => {
  if (e.data && e.data.type === 'moi-content' && e.data.content) {
    C = e.data.content;
    render();
  }
});

const esc = (t) => String(t == null ? '' : t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const pick = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), C);

/* ——— сборка страницы ——— */
function links(items) {
  return (items || []).map((it) => `<a href="${esc(it.href || '#')}">${esc(it.label)}</a>`).join('');
}

function render() {
  document.title = C.title || 'Musical on Ice';
  document.querySelectorAll('[data-f]').forEach((el) => { el.textContent = pick(el.dataset.f) || ''; });
  document.querySelectorAll('#logo, #logo-foot').forEach((el) => { el.alt = C.logoAlt || ''; });

  const el = (id) => document.getElementById(id);

  el('nav').innerHTML = links(C.nav);

  el('cta').innerHTML =
    `<button class="buy" type="button">${esc(C.hero.primary)}</button>` +
    `<a class="quiet" href="${esc(C.hero.secondaryHref || '#')}">${esc(C.hero.secondary)}</a>`;

  const A = C.about || {};
  const factsBox = el('facts');
  if (factsBox) {
    factsBox.innerHTML = (A.facts || []).map((f) => `
      <div class="fact"><div class="fact-value">${esc(f.value)}</div><div class="fact-label">${esc(f.label)}</div></div>`).join('');
  }
  const reel = el('reel');

/* нарезанное видео (HLS): Safari играет сам, остальным нужен hls.js из папки vendor */
let hlsLib = null;
function withHls() {
  if (hlsLib) return hlsLib;
  hlsLib = new Promise((resolve) => {
    if (window.Hls) return resolve(window.Hls);
    const sources = ['vendor/hls.min.js', 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.light.min.js'];
    (function next(i) {
      if (i >= sources.length) return resolve(null);
      const sc = document.createElement('script');
      sc.src = sources[i];
      sc.onload = () => resolve(window.Hls || null);
      sc.onerror = () => { sc.remove(); next(i + 1); };
      document.head.appendChild(sc);
    })(0);
  });
  return hlsLib;
}

function setupHlsVideos(root) {
  (root || document).querySelectorAll('video.hls').forEach((v) => {
    const src = v.dataset.src;
    if (!src || v.dataset.ready) return;
    v.dataset.ready = '1';
    if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = src; return; }
    const start = () => withHls().then((Hls) => {
      if (!Hls || !Hls.isSupported()) { v.src = src; return; }
      const h = new Hls({ capLevelToPlayerSize: true });
      h.loadSource(src);
      h.attachMedia(v);
      v.addEventListener('emptied', () => h.destroy(), { once: true });
    });
    v.addEventListener('play', start, { once: true });
    v.addEventListener('pointerdown', start, { once: true });
  });
}

/* просмотр фото во весь экран — одна панель на всю страницу */
let lb = null, lbShots = [], lbAt = 0;

function lbBuild() {
  if (lb) return lb;
  lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.hidden = true;
  lb.innerHTML = `
    <button class="lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Previous">&#8249;</button>
    <img alt="">
    <button class="lb-nav lb-next" type="button" aria-label="Next">&#8250;</button>`;
  document.body.appendChild(lb);
  lb.querySelector('.lb-close').addEventListener('click', lbClose);
  lb.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); lbShow(lbAt - 1); });
  lb.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); lbShow(lbAt + 1); });
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.tagName === 'IMG') lbClose(); });
  document.addEventListener('keydown', (e) => {
    if (!lb || lb.hidden) return;
    if (e.key === 'Escape') lbClose();
    if (e.key === 'ArrowLeft') lbShow(lbAt - 1);
    if (e.key === 'ArrowRight') lbShow(lbAt + 1);
  });
  return lb;
}

function lbShow(i) {
  if (!lbShots.length) return;
  lbAt = (i + lbShots.length) % lbShots.length;
  lbBuild().querySelector('img').src = lbShots[lbAt];
}

function lbOpen(i) {
  lbBuild().hidden = false;
  document.body.style.overflow = 'hidden';

}

function lbClose() {
  if (!lb) return;
  lb.hidden = true;
  lb.querySelector('img').removeAttribute('src');
  document.body.style.overflow = '';
}

function wireLightbox(root, shots) {
  lbShots = shots || [];

/* «0:12» или «12» -> секунды */
function toSeconds(v) {
  if (v == null || v === '') return null;
  const parts = String(v).trim().split(':').map(Number);
  if (parts.some(isNaN)) return null;
  const sec = parts.reduce((acc, n) => acc * 60 + n, 0);
  return sec >= 0 ? sec : null;
}

function setupHeroVideo(sh) {
  const v = document.getElementById('sh-hero-vid');
  if (!v || !sh.heroVideo) return;
  const start = toSeconds(sh.heroStart);
  const end = toSeconds(sh.heroEnd);
  v.src = sh.heroVideo + (start ? '#t=' + start + (end ? ',' + end : '') : '');
  v.muted = true;
  v.loop = !(end && start !== null);
  const rewind = () => { try { v.currentTime = start || 0; } catch (e) {} };
  v.addEventListener('loadedmetadata', () => { if (start) rewind(); });
  if (start && v.readyState >= 1) rewind();
  if (end) v.addEventListener('timeupdate', () => { if (v.currentTime >= end) rewind(); });
  v.addEventListener('ended', rewind);
  v.addEventListener('error', () => { v.remove(); });
  const go = () => { const r = v.play(); if (r && r.catch) r.catch(() => {}); };
  v.addEventListener('loadeddata', go);
  v.addEventListener('canplay', go);
  v.load();
  go();
}

/* ——— звук фортепианной клавиши ——— */
const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
let ac = null, noise = null;

function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    const len = Math.floor(ac.sampleRate * .08);
    noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function strike(freq, weight) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime;

  const out = a.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(.19 * weight, t + .006);
  out.gain.exponentialRampToValueAtTime(.055 * weight, t + .22);
  out.gain.exponentialRampToValueAtTime(.0001, t + 1.9);

  const tone = a.createBiquadFilter();
  tone.type = 'lowpass';
  tone.frequency.setValueAtTime(4200, t);
  tone.frequency.exponentialRampToValueAtTime(900, t + 1.2);
  tone.connect(out);
  out.connect(a.destination);

  [[1, .6, 'triangle'], [2, .2, 'sine'], [3, .07, 'sine'], [4.02, .03, 'sine']].forEach(([m, g, type]) => {
    const o = a.createOscillator(), v = a.createGain();
    o.type = type;
    o.frequency.value = freq * m;
    o.detune.value = Math.random() * 7 - 3.5;
    v.gain.value = g;
    o.connect(v); v.connect(tone);
    o.start(t); o.stop(t + 2);
  });

  const n = a.createBufferSource(), nf = a.createBiquadFilter(), ng = a.createGain();
  n.buffer = noise;
  nf.type = 'bandpass'; nf.frequency.value = 1900; nf.Q.value = .8;
  ng.gain.setValueAtTime(.075 * weight, t);
  ng.gain.exponentialRampToValueAtTime(.0001, t + .09);
  n.connect(nf); nf.connect(ng); ng.connect(a.destination);
  n.start(t);
}

/* ——— рояль: две октавы, мышь, палец и клавиатура ——— */
const WHITE = [
  ['C4', 261.63, 'z'], ['D4', 293.66, 'x'], ['E4', 329.63, 'c'], ['F4', 349.23, 'v'],
  ['G4', 392.00, 'b'], ['A4', 440.00, 'n'], ['B4', 493.88, 'm'],
  ['C5', 523.25, 'q'], ['D5', 587.33, 'w'], ['E5', 659.25, 'e'], ['F5', 698.46, 'r'],
  ['G5', 783.99, 't'], ['A5', 880.00, 'y'], ['B5', 987.77, 'u']
];
/* чёрная клавиша сидит на стыке после белой с этим номером */
const BLACK = [
  [0, 'C#4', 277.18, 's'], [1, 'D#4', 311.13, 'd'],
  [3, 'F#4', 369.99, 'g'], [4, 'G#4', 415.30, 'h'], [5, 'A#4', 466.16, 'j'],
  [7, 'C#5', 554.37, '2'], [8, 'D#5', 622.25, '3'],
  [10, 'F#5', 739.99, '5'], [11, 'G#5', 830.61, '6'], [12, 'A#5', 932.33, '7']
];

const byLetter = {};

function buildPiano() {
  const bed = document.getElementById('keybed');
  if (!bed) return;
  bed.innerHTML = '';

  WHITE.forEach(([name, freq, letter], i) => {
    const k = document.createElement('button');
    k.className = 'wkey';
    k.dataset.oct = i < 7 ? '1' : '2';
    k.type = 'button';
    k.textContent = letter.toUpperCase();
    k.setAttribute('aria-label', 'Note ' + name);
    k.dataset.freq = freq;
    bed.appendChild(k);
    byLetter[letter] = k;
  });

  BLACK.forEach(([after, name, freq, letter]) => {
    const k = document.createElement('button');
    k.className = 'bkey';
    k.type = 'button';
    k.textContent = letter.toUpperCase();
    k.setAttribute('aria-label', 'Note ' + name);
    k.dataset.freq = freq;
    k.style.setProperty('--after', after);
    k.dataset.oct = after < 7 ? '1' : '2';
    bed.appendChild(k);
    byLetter[letter] = k;
  });

  const press = (k) => {
    if (!k) return;
    strike(+k.dataset.freq, k.classList.contains('bkey') ? .85 : 1);
    k.classList.add('lit');
    setTimeout(() => k.classList.remove('lit'), 160);
  };

  let held = false;
  bed.addEventListener('pointerdown', (e) => {
    const k = e.target.closest('.wkey, .bkey');
    if (!k) return;
    held = true;
    e.preventDefault();
    press(k);
  });
  bed.addEventListener('pointerover', (e) => {
    if (!held) return;
    const k = e.target.closest('.wkey, .bkey');
    if (k) press(k);
  });
  addEventListener('pointerup', () => { held = false; });

  const down = new Set();
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    const l = e.key.toLowerCase();
    if (!byLetter[l] || down.has(l)) return;
    down.add(l);
    press(byLetter[l]);
  });
  addEventListener('keyup', (e) => down.delete(e.key.toLowerCase()));
}

/* мелодии: буквы клавиш через пробел, «-» — пауза */
const FALLBACK_MELODY = 'e g n q m n b c x c b n e';
let running = [];
let runningBtn = null;

function stopMelody() {
  running.forEach(clearTimeout);
  running = [];
  if (runningBtn) {
    runningBtn.classList.remove('on');
    runningBtn.textContent = runningBtn.dataset.title;
  }
  runningBtn = null;
}

function playMelody(notes, tempo, btn) {
  if (runningBtn === btn) { stopMelody(); return; }
  stopMelody();
  runningBtn = btn;
  btn.classList.add('on');
  btn.textContent = (C.piano && C.piano.stop) || 'Stop';

  const step = Math.max(90, Math.min(1200, parseInt(tempo, 10) || 320));
  const list = String(notes || '').trim().split(/\s+/).filter(Boolean);
  list.forEach((token, i) => {
    if (token === '-' || token === '.') return;
    const letter = token[0].toLowerCase();
    running.push(setTimeout(() => {
      let k = byLetter[letter];
      if (k && k.offsetParent === null) {
        const low = { q: 'z', w: 'x', e: 'c', r: 'v', t: 'b', y: 'n', u: 'm' }[letter];
        if (low) k = byLetter[low];
      }
      if (!k) return;
      strike(+k.dataset.freq, k.classList.contains('bkey') ? .8 : .95);
      k.classList.add('lit');
      setTimeout(() => k.classList.remove('lit'), 220);
    }, i * step));
  });
  running.push(setTimeout(stopMelody, list.length * step + 400));
}

/* ряд кнопок с мелодиями под роялем */
function buildMelodies() {
  const bar = document.getElementById('piano-bar');
  if (!bar) return;
  stopMelody();
  bar.innerHTML = '';
  const P = C.piano || {};
  const shows = (C.shows && C.shows.items) || [];
  let list = (P.melodies || []).filter((m) => m && (m.notes || '').trim());
  if (!list.length) list = [{ title: P.play || 'Play the theme', notes: FALLBACK_MELODY, tempo: 340 }];

  list.forEach((m) => {
    const show = shows.find((x) => x.slug && x.slug === m.show);
    const title = m.title || (show && show.title) || P.play || 'Play';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mel';
    b.dataset.title = title;
    b.textContent = title;
    b.addEventListener('click', () => playMelody(m.notes, m.tempo, b));
    bar.appendChild(b);
  });

  if (P.hintBar) {
    const note = document.createElement('span');
    note.className = 'piano-hint';
    note.textContent = P.hintBar;
    bar.appendChild(note);
  }
}

/* ——— рисунок скрипки ——— */
/* ——— музыка: карточки альбомов и прослушивание отрывка ——— */
const player = new Audio();
player.preload = 'metadata';
let playingRow = null;
let playingSrc = '';
let scrubbing = false;

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '';
  const m = Math.floor(sec / 60), r = Math.round(sec % 60);
  return m + ':' + String(r === 60 ? 0 : r).padStart(2, '0');
}

function rowBar(row) { return row ? row.querySelector('.album-bar, .trk-bar') : null; }

function setFill(row, ratio) {
  const bar = rowBar(row);
  const fill = bar && bar.querySelector('i');
  if (fill) fill.style.width = clamp01(ratio) * 100 + '%';
}

function showTime(row, sec) {
  const len = row && row.querySelector('.trk-len');
  if (!len) return;
  if (len.dataset.full === undefined) len.dataset.full = len.textContent;
  len.textContent = sec === null ? len.dataset.full : (fmtTime(sec) + (len.dataset.full ? ' / ' + len.dataset.full : ''));
}

function stopPreview() {
  player.pause();
  scrubbing = false;
  if (playingRow) {
    playingRow.classList.remove('playing');
    playingRow.classList.remove('paused');
    const b = playingRow.querySelector('.album-play, .trk-play');
    if (b) b.setAttribute('aria-label', (C.music && C.music.listen) || 'Preview');
    setFill(playingRow, 0);
    showTime(playingRow, null);
  }
  playingRow = null;
}

/* включить строку с нужного места (ratio 0…1) */
function playRow(row, src, ratio) {
  if (!row || !src) return;
  const M = C.music || {};
  if (playingRow && playingRow !== row) stopPreview();
  const seek = (r) => { if (player.duration) player.currentTime = clamp01(r) * player.duration; };
  if (playingSrc !== src) {
    playingSrc = src;
    player.src = src;
    if (ratio != null) player.addEventListener('loadedmetadata', () => seek(ratio), { once: true });
  } else if (ratio != null) {
    seek(ratio);
  }
  playingRow = row;
  row.classList.add('playing');
  row.classList.remove('paused');
  const btn = row.querySelector('.album-play, .trk-play');
  if (btn) btn.setAttribute('aria-label', M.pause || 'Pause');
  const go = player.play();
  if (go && go.catch) go.catch(() => {});
}

function toggleRow(row, src) {
  if (playingRow === row) {
    if (player.paused) { row.classList.remove('paused'); const go = player.play(); if (go && go.catch) go.catch(() => {}); }
    else { player.pause(); row.classList.add('paused'); }
    return;
  }
  playRow(row, src, 0);
}

/* перемотка: клик или протягивание по полоске */
function wireBar(row, src) {
  const bar = rowBar(row);
  if (!bar) return;
  const ratioAt = (e) => {
    const r = bar.getBoundingClientRect();
    return clamp01((e.clientX - r.left) / (r.width || 1));
  };
  bar.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    scrubbing = true;
    try { bar.setPointerCapture(e.pointerId); } catch (err) {}
    const r = ratioAt(e);
    setFill(row, r);
    if (playingRow === row) {
      if (player.duration) player.currentTime = r * player.duration;
      if (player.paused) playRow(row, src, r);
    } else {
      playRow(row, src, r);
    }
  });
  bar.addEventListener('pointermove', (e) => {
    if (!scrubbing || playingRow !== row) return;
    const r = ratioAt(e);
    setFill(row, r);
    if (player.duration) { player.currentTime = r * player.duration; showTime(row, player.currentTime); }
  });
  const done = () => { scrubbing = false; };
  bar.addEventListener('pointerup', done);
  bar.addEventListener('pointercancel', done);
  bar.addEventListener('click', (e) => e.stopPropagation());
}

player.addEventListener('ended', stopPreview);
player.addEventListener('timeupdate', () => {
  if (!playingRow || scrubbing || !player.duration) return;
  setFill(playingRow, player.currentTime / player.duration);
  showTime(playingRow, player.currentTime);
});

function albumHTML(a, i) {
  const M = C.music || {};
  const cover = a.cover || '';
  const tracks = (a.tracks || []).filter((t) => t && (t.title || t.audio));
  return `
      <li class="album${tracks.length ? ' has-tracks' : ''}" data-i="${i}">
        <div class="album-cover">
          <svg class="album-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v12.3"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="15.3" r="2.5"/><path d="M9 9.2l11-2.2"/></svg>
          ${cover ? `<img src="${esc(cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        </div>
        <div>
          <div class="album-title">${esc(a.title)}</div>
          <div class="album-sub">${esc(a.subtitle || '')}${tracks.length ? ` · ${tracks.length} tracks` : ''}</div>
          ${tracks.length ? `<button class="album-toggle" type="button" aria-expanded="false">${esc(M.tracklist || 'Tracklist')}<i></i></button>` : ''}
        </div>
        <div class="album-side">
          ${a.buyUrl
            ? `${a.price ? `<span class="album-price">${esc(a.price)}</span>` : ''}
               <a class="pick" href="${esc(a.buyUrl)}" target="_blank" rel="noopener">${esc(M.buy || 'Buy')}</a>`
            : `<span class="album-soon">${esc(M.soon || 'Coming soon')}</span>`}
        </div>
        ${tracks.length ? `<div class="album-panel"><ol class="trks">${trackRows(tracks)}</ol></div>` : ''}
      </li>`;
}

/* один список альбомов: разметка и кнопки прослушивания */
function fillAlbums(box, albums) {
  if (!box) return;
  const M = C.music || {};
  box.innerHTML = albums.map((a, i) => albumHTML(a, i)).join('');

  box.querySelectorAll('.album.has-tracks').forEach((row) => {
    const a = albums[+row.dataset.i];
    wireTrackSet(row, a);
    const btn = row.querySelector('.album-toggle');
    const toggle = () => {
      const open = row.classList.toggle('open');
      if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (!open && playingRow && row.contains(playingRow)) stopPreview();
    };
    if (btn) btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    row.addEventListener('click', (e) => {
      if (e.target.closest('a, button, .trk')) return;
      toggle();
    });
  });

}

/* строки треков — общие для главной и страницы шоу */
function trackRows(tracks) {
  const M = C.music || {};
  return tracks.map((t, i) => `
        <li class="trk${t.audio ? '' : ' trk-mute'}" data-i="${i}">
          ${t.audio
            ? `<button class="trk-play" type="button" aria-label="${esc(M.listen || 'Preview')}"></button>`
            : '<span class="trk-num">' + (i + 1) + '</span>'}
          <span class="trk-title">${esc(t.title || '')}</span>
          <span class="trk-len">${esc(t.length || '')}</span>
          <span class="trk-bar"><i></i></span>
        </li>`).join('');
}

/* треки альбома на странице шоу: список, каждый играется отдельно */
function trackSetHTML(a) {
  const M = C.music || {};
  const tracks = (a.tracks || []).filter((t) => t && (t.title || t.audio));
  const rows = trackRows(tracks);
  return `
      <div class="trackset" data-album="${esc(a.title || '')}">
        <div class="trk-head">
          <div class="trk-cover">
            <svg class="album-note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V5.2l11-2.2v12.3"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="15.3" r="2.5"/><path d="M9 9.2l11-2.2"/></svg>
            ${a.cover ? `<img src="${esc(a.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          </div>
          <div class="trk-meta">
            <div class="album-title">${esc(a.title || '')}</div>
            <div class="album-sub">${esc(a.subtitle || '')}${tracks.length ? ` · ${tracks.length} tracks` : ''}</div>
          </div>
          <div class="album-side">
            ${a.buyUrl
              ? `${a.price ? `<span class="album-price">${esc(a.price)}</span>` : ''}
                 <a class="pick" href="${esc(a.buyUrl)}" target="_blank" rel="noopener">${esc(M.buy || 'Buy')}</a>`
              : `<span class="album-soon">${esc(M.soon || 'Coming soon')}</span>`}
          </div>
        </div>
        ${rows ? `<ol class="trks">${rows}</ol>` : ''}
      </div>`;
}

function wireTrackSet(box, a) {
  const M = C.music || {};
  const tracks = (a.tracks || []).filter((t) => t && (t.title || t.audio));
  box.querySelectorAll('.trk').forEach((row) => {
    const t = tracks[+row.dataset.i];
    if (!t || !t.audio) return;
    wireBar(row, t.audio);
    const btn = row.querySelector('.trk-play');
    if (btn) btn.addEventListener('click', (e) => { e.stopPropagation(); toggleRow(row, t.audio); });
  });
}

/* альбомы, привязанные к шоу */
function albumsOfShow(sh) {
  const albums = (C.music && C.music.albums) || [];
  if (!sh || !sh.slug) return [];
  return albums.filter((a) => (a.show || '') === sh.slug);
}

function buildMusic() {
  const box = document.getElementById('albums');
  if (!box) return;
  const albums = (C.music && C.music.albums) || [];
  const section = document.getElementById('music');
  if (section) section.hidden = !albums.length;
  stopPreview();
  fillAlbums(box, albums);
}

loadContent().then(() => {
  render();
  buildPiano();
  buildMelodies();
  route();
});
</script>
